<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión</title>
  <!-- <script src="https://jsdelivr.net"></script> -->
  <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
  <style>
    * {
    margin: 0;
    padding: 0;
    box-sizing: border-box; 
    }
  </style>
</head>
<body>

<div class="min-h-screen bg-orange-100 flex flex-col items-center justify-center p-4">
  <form id="loginForm" action="/ingresar" method="POST" class="bg-amber-100 p-6 rounded-xl shadow-md w-full max-w-md flex flex-col gap-4">

    <h2 class="text-2xl font-bold text-center text-gray-800 mb-2">Iniciar Sesión</h2>

    <div class="flex flex-col">
      <label for="loginEmail" class="font-medium text-gray-700 mb-1">Correo Electrónico:</label>
      <input type="email" id="loginEmail" name="email" class="border border-orange-400 rounded p-2 focus:outline-none focus:ring-2 focus:ring-orange-500" required placeholder="correo@gmail.com">
    </div>

    <div class="flex flex-col">
      <label for="loginPassword" class="font-medium text-gray-700 mb-1">Contraseña:</label>
      <input type="password" id="loginPassword" name="password" class="border border-orange-400 rounded p-2 focus:outline-none focus:ring-2 focus:ring-orange-500" required placeholder="Ingresa tu contraseña">
    <div class="flex items-center gap-2 mt-2">
    <input type="checkbox" id="verPassword" class="w-4 h-4 accent-orange-500 cursor-pointer">
    <label for="verPassword" class="text-sm text-gray-600 cursor-pointer select-none">Mostrar contraseña</label>
  </div>

      <span id="errorLogin" class="text-sm text-red-600 mt-1 hidden"></span>
    </div>

    <button type="submit" class="bg-orange-400 hover:bg-orange-700 text-white font-medium py-2 rounded transition duration-200 mt-2">Ingresar</button>
    
    <p class="text-sm text-center text-gray-600 mt-2">
      ¿No tienes cuenta? <a href="register.html" class="text-orange-600 font-medium hover:underline">Regístrate aquí</a>
    </p>
  </form>
</div>

<script src=".\validaLogin.js"></script> 

</body>
</html>
